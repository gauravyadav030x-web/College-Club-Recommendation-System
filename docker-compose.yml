version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: college_club_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: college_clubs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_club_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/college_clubs_db"
      SECRET_KEY: "prod-secret-change-me-recommended-long-random-string"
      TFIDF_WEIGHT: 0.50
      OVERLAP_WEIGHT: 0.35
      GRAPH_WEIGHT: 0.15
    ports:
      - "8000:8000"
    command: >
      sh -c "python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_club_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
